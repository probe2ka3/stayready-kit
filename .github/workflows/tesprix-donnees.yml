name: TesPrix — données gratuites et page publique

# Plan sans dépenses (comparateur/docs/PLAN_SANS_DEPENSES.md). Dépôt public : exécuteurs standard
# gratuits, sans moyen de paiement enregistré (aucun dépassement facturable possible).
#
# - Toujours : recalcul de la matrice des 50 aliments de base et de la page statique à partir des
#   instantanés versionnés (+ relevés en magasin), artefact téléchargeable 7 jours.
# - Collecte Lidl + Open Prices depuis les serveurs de GitHub : DÉSACTIVÉE par défaut. Elle ne tourne
#   (tâche planifiée ou lancement manuel) que si la variable de dépôt TESPRIX_COLLECTE_ACTIONS vaut
#   « oui », décision de l'exploitant après lecture des conditions de GitHub Actions (§ 5 du plan).
#   Jamais Aldi ni Denner (conditions : usage privé), jamais d'appel à une API d'IA.
# - Publication GitHub Pages : seulement depuis main et si la variable TESPRIX_PAGES vaut « oui »
#   (Pages activé avec la source « GitHub Actions »). Les tâches planifiées ne s'exécutent que sur la
#   branche par défaut.

on:
  push:
    paths:
      - 'comparateur/data/prices/live/**'
      - 'comparateur/data/releves/**'
      - 'comparateur/data/matching/reviewed.json'
      - 'comparateur/data/public/template.html'
      - 'comparateur/apps/worker/src/matrix.ts'
      - '.github/workflows/tesprix-donnees.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

concurrency:
  group: tesprix-donnees-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: comparateur

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COLLECTE: ${{ github.event_name != 'push' && vars.TESPRIX_COLLECTE_ACTIONS == 'oui' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: comparateur/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: comparateur/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Instantanés de la collecte précédente (cache Actions)
        if: env.COLLECTE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: comparateur/.cache-live
          key: tesprix-live-${{ github.run_id }}
          restore-keys: tesprix-live-
      - name: Reprise des instantanés plus récents que ceux du dépôt
        if: env.COLLECTE == 'true'
        run: pnpm job live-restore --from=.cache-live
      - name: Collecte Lidl et Open Prices (robots.txt, 3 s entre deux requêtes, sans Aldi)
        if: env.COLLECTE == 'true'
        timeout-minutes: 50
        run: pnpm job collect --only=lidl-web,open-prices
      - name: Mise en cache des instantanés
        if: env.COLLECTE == 'true' && always()
        run: mkdir -p .cache-live && cp data/prices/live/*.json .cache-live/
      - if: env.COLLECTE == 'true' && always()
        uses: actions/cache/save@v4
        with:
          path: comparateur/.cache-live
          key: tesprix-live-${{ github.run_id }}
      - name: Relevés en magasin
        run: pnpm job releves
      - name: Matrice des aliments de base et page publique
        run: pnpm job matrice-essentiels
      - name: Contrôle de non-régression
        run: pnpm job validate --quiet
      - name: Page publique (aucune donnée de source non publiable)
        run: |
          mkdir -p ../_site
          cp data/public/index.html ../_site/index.html
          if grep -qE 'aldi-api|denner-web' ../_site/index.html; then echo 'Donnée non publiable dans la page publique' && exit 1; fi
          if [ -n "$(ls data/private/live 2>/dev/null)" ]; then echo 'Instantané privé présent sur le serveur : interdit' && exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tesprix-page-publique
          path: |
            _site/index.html
            comparateur/data/matrice/essentiels.md
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && vars.TESPRIX_PAGES == 'oui'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    needs: donnees
    if: github.ref == 'refs/heads/main' && vars.TESPRIX_PAGES == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
