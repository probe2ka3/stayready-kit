name: TesPrix — essai du cycle quotidien sur GitHub Actions (sources publiables)

# Mesure, sur les serveurs de GitHub, de la durée réelle d'un cycle et de l'accès aux sources, avec
# le script prévu pour le dépôt privé (comparateur/ops/actions-prive/cycle.sh). Dépôt PUBLIC :
# journaux et caches sont lisibles par tous, donc seulement Lidl et Open Prices (publiables), état
# dans un dossier temporaire, aucun artefact, aucun cache, rien de réécrit dans le dépôt.
# Déclenché uniquement quand le script du cycle change (pas de collecte à chaque poussée ni pour une
# simple modification de documentation). Premier essai : exécution 37114095944 du 03.10.2026.

on:
  push:
    paths:
      - 'comparateur/ops/actions-prive/cycle.sh'
      - 'comparateur/ops/actions-prive/etat.mjs'

permissions:
  contents: read

concurrency:
  group: tesprix-essai-cycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: comparateur
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: comparateur/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Cycle quotidien (Lidl + Open Prices ; jamais Aldi, Denner ni le journal Coop)
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/debut"
          bash ops/actions-prive/cycle.sh "$RUNNER_TEMP/etat" --sources=lidl-web,open-prices
      - name: 'Contrôle : aucune donnée de source privée sur ce serveur'
        run: |
          if [ -n "$(ls data/private/live 2>/dev/null)" ] || ls "$RUNNER_TEMP/etat/private/live" 2>/dev/null | grep -q .; then
            echo 'Instantané privé présent : interdit dans un dépôt public' && exit 1
          fi
      - name: Suivi par source (même module que le dépôt privé ; une source en échec rend l'essai rouge)
        if: always()
        run: |
          node ops/actions-prive/etat.mjs noter "$RUNNER_TEMP/etat" --systeme github --declencheur essai \
            --debut "$(cat "$RUNNER_TEMP/debut")" --execution "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          sed -n '/^| Jour/,$p' "$RUNNER_TEMP/etat/suivi/SUIVI.md"
