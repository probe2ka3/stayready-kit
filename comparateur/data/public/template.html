<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TesPrix — aliments de base</title>
<meta name="description" content="Prix de 50 aliments de base dans les enseignes suisses, à partir de sources gratuites et réutilisables. Page statique générée par pnpm job matrice-essentiels.">
<meta name="robots" content="noindex">
<style>
:root {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #e4e1da; --card: #ffffff;
  --accent: #0f6b4f; --accent-bg: #e3f2ec; --warn: #8a5a00; --warn-bg: #fdf1d8; --miss: #9a9892;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --fg: #ecebe6; --muted: #a09e97; --line: #34332f; --card: #1f1f1c;
    --accent: #6fd0ad; --accent-bg: #173a2f; --warn: #f0c46a; --warn-bg: #3a2f17; --miss: #77756f;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --fg: #ecebe6; --muted: #a09e97; --line: #34332f; --card: #1f1f1c;
  --accent: #6fd0ad; --accent-bg: #173a2f; --warn: #f0c46a; --warn-bg: #3a2f17; --miss: #77756f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 70ch; }
.notice { background: var(--warn-bg); color: var(--fg); border-left: 3px solid var(--warn); padding: 10px 12px; border-radius: 6px; margin: 0 0 16px; max-width: 80ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin: 0 0 16px; max-width: 900px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.stat b { font-size: 1.2rem; display: block; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; align-items: center; }
input, select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
label.chk { display: flex; gap: 6px; align-items: center; color: var(--muted); }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
th { font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
tr.cat td { background: var(--bg); font-weight: 600; }
.need small { color: var(--muted); display: block; }
.price b { font-variant-numeric: tabular-nums; }
.price small { display: block; color: var(--muted); font-size: .8rem; }
.best b { color: var(--accent); }
.tag { display: inline-block; font-size: .72rem; padding: 0 6px; border-radius: 10px; background: var(--accent-bg); color: var(--accent); margin-top: 2px; }
.miss { color: var(--miss); font-size: .85rem; }
footer { color: var(--muted); font-size: .85rem; margin-top: 20px; max-width: 80ch; }
@media (max-width: 760px) {
  table, thead, tbody, tr, td { display: block; width: 100%; }
  thead { display: none; }
  tr { border-bottom: 1px solid var(--line); padding: 6px 0; }
  td { border: 0; padding: 4px 8px; }
  td.price::before { content: attr(data-chain); display: inline-block; width: 6.5em; color: var(--muted); font-size: .8rem; }
  td.price small { display: inline; margin-left: 6px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .stat { padding: 6px 10px; font-size: .85rem; }
}
</style>
</head>
<body>
<main>
  <h1>Aliments de base : prix par enseigne</h1>
  <p class="lead" id="lead"></p>
  <p class="notice">Version publique : seuls des prix issus de sources gratuites et réutilisables sont affichés. Prix indicatifs, datés, à vérifier en magasin. Une case vide signifie « aucune donnée gratuite disponible », jamais « introuvable en magasin ».</p>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input id="q" type="search" placeholder="Rechercher un aliment" aria-label="Rechercher un aliment">
    <select id="cat" aria-label="Rayon"><option value="">Tous les rayons</option></select>
    <label class="chk"><input type="checkbox" id="cmp"> comparables uniquement (2 enseignes ou plus)</label>
  </div>
  <table>
    <thead><tr id="head"><th>Besoin</th></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <footer id="foot"></footer>
</main>
<script>
const DATA = /*__DATA__*/null;
const fmt = (c) => (c / 100).toFixed(2);
const day = (iso) => iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) + '.' + iso.slice(0, 4) : '';
const SRC = { official_public: 'site officiel', store_survey: 'relevé en magasin', community: 'Open Prices' };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
function render() {
  if (!DATA) return;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const cat = document.getElementById('cat').value;
  const onlyCmp = document.getElementById('cmp').checked;
  const body = document.getElementById('body');
  let html = '';
  let current = '';
  for (const r of DATA.rows) {
    const known = DATA.chains.filter((c) => r.cells[c.id].total != null);
    if (q && !r.name.toLowerCase().includes(q)) continue;
    if (cat && r.category !== cat) continue;
    if (onlyCmp && known.length < 2) continue;
    if (r.category !== current) {
      current = r.category;
      html += '<tr class="cat"><td colspan="' + (DATA.chains.length + 1) + '">' + esc(current) + '</td></tr>';
    }
    const min = known.length > 1 ? Math.min(...known.map((c) => r.cells[c.id].total)) : null;
    html += '<tr><td class="need">' + esc(r.name) + '<small>' + esc(r.quantity) + '</small></td>';
    for (const c of DATA.chains) {
      const x = r.cells[c.id];
      if (x.total == null) {
        html += '<td class="price" data-chain="' + esc(c.name) + '"><span class="miss">' + (x.status === 'stale' ? 'prix trop ancien' : '—') + '</span></td>';
        continue;
      }
      const unit = x.unit ? fmt(x.unit.cents) + ' CHF/' + (x.unit.basis === 'piece' ? 'pce' : x.unit.basis) : '';
      const promo = x.promo ? ' · action du ' + day(x.promo.validFrom).slice(0, 5) + ' au ' + day(x.promo.validTo).slice(0, 5) : '';
      const local = x.status === 'store_survey' ? ' · ce magasin seulement' : String(x.scope || '').startsWith('zone') ? ' · prix régional' : '';
      // Relevé communautaire : toujours « indicatif », avec son lieu (visible, pas seulement au survol).
      const crowd = x.status === 'community' ? ' · indicatif' + (x.place ? ', relevé : ' + esc(x.place) : '') : '';
      html += '<td class="price' + (min != null && x.total === min ? ' best' : '') + '" data-chain="' + esc(c.name) + '"><b>' + fmt(x.total) + '</b>' +
        (x.packs > 1 ? ' <small>(' + x.packs + ' paquets)</small>' : '') + (x.weight ? ' <small>au poids, estimé</small>' : '') +
        '<small>' + esc(x.product) + '</small><small>' + unit + ' · ' + day(x.date) + promo + local + crowd + '</small>' +
        '<span class="tag" title="' + esc(x.place || x.scope || '') + '">' + SRC[x.status] + '</span></td>';
    }
    html += '</tr>';
  }
  body.innerHTML = html || '<tr><td colspan="6" class="miss">Aucun aliment ne correspond.</td></tr>';
}
if (DATA) {
  document.getElementById('lead').textContent = DATA.rows.length + ' aliments de base, ' + DATA.chains.length + ' enseignes. Données du ' + day(DATA.generatedAt) + '. Montant payé pour la quantité indiquée (paquets entiers), prix au kilo, au litre ou à la pièce en dessous.' +
    (DATA.coverage ? ' Prix affichables par enseigne : ' + DATA.chains.map((c) => esc(c.name) + ' ' + (DATA.coverage[c.id] || 0) + '/' + DATA.rows.length).join(', ') + '. Ce n’est pas une comparaison complète des enseignes : seuls les aliments avec un prix dans au moins deux enseignes se comparent.' : '');
  document.getElementById('head').innerHTML += DATA.chains.map((c) => '<th>' + esc(c.name) + '</th>').join('');
  document.getElementById('stats').innerHTML = ['1', '2', '3', '4', '5'].map((k) => '<div class="stat"><b>' + DATA.comparable[k] + '</b>' + (k === '1' ? 'avec au moins 1 prix' : 'comparables dans ' + k + ' enseignes ou plus') + '</div>').join('');
  const cats = [...new Set(DATA.rows.map((r) => r.category))];
  document.getElementById('cat').innerHTML += cats.map((c) => '<option>' + esc(c) + '</option>').join('');
  document.getElementById('foot').innerHTML = 'Sources : ' + DATA.sources.map((s) => esc(s.connectorId) + ' (' + day(s.collectedAt) + ')').join(', ') +
    '. Prix communautaires : Open Prices (Open Food Facts), base de données sous licence ODbL 1.0 ; un relevé communautaire est « indicatif », daté, et vaut pour la région du magasin où il a été fait. Les prix publiés par Aldi, Denner et Coop (journal des actions) ne sont pas affichés : leurs conditions réservent ces données à un usage privé ou interdisent leur publication sans accord écrit. Migros : aucune source officielle accessible. Pour ces quatre enseignes, seuls les relevés communautaires ou en magasin apparaissent.';
  for (const id of ['q', 'cat', 'cmp']) document.getElementById(id).addEventListener('input', render);
  render();
}
</script>
</body>
</html>
