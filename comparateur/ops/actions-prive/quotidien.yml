# TesPrix — collecte quotidienne sur GitHub Actions, dans le DÉPÔT PRIVÉ probe2ka3/tesprix-collecte.
# À copier tel quel dans ce dépôt : .github/workflows/quotidien.yml (branche par défaut, main).
# Mode d'emploi, coûts et limites : comparateur/ops/actions-prive/README.md (dépôt public).
#
# - Code lu dans le dépôt public (lecture seule, aucun jeton) ; état (instantanés, journal des
#   exécutions, suivi) enregistré dans ce dépôt privé, dossier etat/. Aucun artefact ; sortie détaillée
#   de la collecte gardée sur l'exécuteur (effacée à la fin) ; journal du workflow : statuts et volumes.
# - Un seul journal partagé avec la tâche Windows (même dossier etat/, verrou etat/verrou.json) : une
#   seule collecte par jour de Zurich, quel que soit le système ; les créneaux suivants ne reprennent
#   que les sources en échec technique. Un rattrapage collecte ce qui est publié au moment du
#   lancement, jamais les prix des jours manqués.
# - Une source en échec ou bloquée rend l'exécution rouge (après enregistrement de l'état) ; une
#   source partielle produit un avertissement. Suivi jour par jour : etat/suivi/SUIVI.md.
# - Aucun secret. Sans moyen de paiement enregistré, l'usage est bloqué une fois le quota gratuit épuisé.

name: TesPrix — collecte quotidienne (privé)

on:
  schedule:
    # Heure de Zurich (heure d'été gérée par GitHub) ; minutes hors de l'heure pile (moins de retard
    # aux heures chargées). Créneaux 2 et 3 : rattrapage seulement (rien à faire si tout a réussi).
    - cron: '17 6 * * *'
      timezone: Europe/Zurich
    - cron: '47 9 * * *'
      timezone: Europe/Zurich
    - cron: '17 14 * * *'
      timezone: Europe/Zurich
  workflow_dispatch:
    inputs:
      force:
        description: 'Relancer toutes les sources même si la collecte du jour est faite'
        type: boolean
        default: false
  # Premier cycle dès l'ajout (ou la modification) de ce fichier.
  push:
    branches: [main]
    paths:
      - '.github/workflows/quotidien.yml'

permissions:
  contents: write

concurrency:
  group: tesprix-quotidien
  cancel-in-progress: false

jobs:
  quotidien:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPOT: ${{ github.workspace }}/depot
      CODE: ${{ github.workspace }}/code/comparateur
      EXECUTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DECLENCHEUR: ${{ github.event_name }}
      FORCE: ${{ inputs.force || 'false' }}
      # Variable de dépôt facultative : limiter les sources (ex. une source qui refuse les serveurs de GitHub).
      TESPRIX_SOURCES: ${{ vars.TESPRIX_SOURCES }}
    steps:
      - name: État partagé (ce dépôt privé)
        uses: actions/checkout@v7
        with:
          path: depot

      - name: Code TesPrix (dépôt public, lecture seule)
        uses: actions/checkout@v7
        with:
          repository: probe2ka3/stayready-kit
          ref: ${{ vars.TESPRIX_CODE_REF || 'claude/swiss-grocery-comparison-w7bk8q' }}
          path: code
          persist-credentials: false

      - name: Collecte à faire ? (journal partagé, verrou)
        id: debut
        run: bash "$CODE/ops/actions-prive/github.sh" debut

      - if: steps.debut.outputs.collecte == 'oui'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: code/comparateur/package.json

      - if: steps.debut.outputs.collecte == 'oui'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/comparateur/pnpm-lock.yaml

      - if: steps.debut.outputs.collecte == 'oui'
        working-directory: code/comparateur
        run: pnpm install --frozen-lockfile

      - name: Cache HTTP (textes du journal Coop de la semaine ; cache privé de ce dépôt)
        if: steps.debut.outputs.collecte == 'oui'
        uses: actions/cache/restore@v6
        with:
          path: code/comparateur/data/private/cache/http
          key: tesprix-http-${{ github.run_id }}
          restore-keys: tesprix-http-

      - name: Collecte (Open Prices, journal Coop, Denner, Aldi, Lidl)
        if: steps.debut.outputs.collecte == 'oui'
        run: bash "$CODE/ops/actions-prive/github.sh" collecte

      - name: Purge du cache HTTP (fichiers de plus de 10 jours)
        if: always() && steps.debut.outputs.collecte == 'oui'
        run: find code/comparateur/data/private/cache/http -type f -mtime +10 -delete 2>/dev/null || true

      - if: always() && steps.debut.outputs.collecte == 'oui'
        uses: actions/cache/save@v6
        with:
          path: code/comparateur/data/private/cache/http
          key: tesprix-http-${{ github.run_id }}

      - name: Suivi, enregistrement de l'état, verdict par source
        if: always()
        env:
          COLLECTE: ${{ steps.debut.outputs.collecte }}
          ISSUE: ${{ steps.debut.outputs.issue }}
        run: bash "$CODE/ops/actions-prive/github.sh" fin
